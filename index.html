<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><title>All AR</title><style>
:root{--bg:#0b1020;--p:#141b2d;--t:#f7f8fb;--m:#9ba7bf;--a:#6ee7ff;--o:#51d88a;--pr:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui}.app{max-width:900px;margin:auto;padding:14px 14px 90px}h1{margin:6px 0 2px}h2{font-size:18px;margin:20px 2px 8px}.sub,.meta,.hint{color:var(--m);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat,.card,.spread{background:var(--p);border-radius:16px}.stat{padding:12px;text-align:center}.stat b{display:block;font-size:22px}.search{width:100%;padding:14px;border:0;border-radius:16px;background:var(--p);color:var(--t);font-size:16px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.chip{border:0;border-radius:999px;background:var(--p);color:var(--t);padding:9px 12px;white-space:nowrap}.chip.active{background:var(--a);color:#00131a;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:9px;position:relative}.card img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:11px;background:#202a45}.missing img{filter:grayscale(1);opacity:.3}.name{font-weight:750;font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px}.promo{position:absolute;right:14px;top:14px;background:var(--pr);color:#181000;font-size:9px;font-weight:800;border-radius:999px;padding:4px 7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.actions button{border:0;border-radius:9px;padding:8px;background:#263150;color:white}.actions .sel{background:var(--o);color:#07150c}.binder,.gallery.hide{display:none}.binder.show{display:block}.spread{padding:10px;margin:12px 0}.spread h3{margin:0 0 8px;font-size:14px}.pages{display:grid;grid-template-columns:1fr 1fr;gap:8px}.page{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0e1528;padding:5px;border-radius:10px}.slot{position:relative;cursor:zoom-in}.slot img,.empty{width:100%;aspect-ratio:63/88;border-radius:4px}.slot img{object-fit:cover}.slot .n{position:absolute;left:2px;top:2px;background:#000b;font-size:7px;padding:1px 3px;border-radius:5px}.empty{border:1px dashed #38435c}.promo-page{border:2px solid #765d1d}.bottom{position:fixed;left:0;right:0;bottom:0;background:#10172aee;display:flex;justify-content:space-around;padding:8px;z-index:20}.bottom button{border:0;background:transparent;color:var(--m);padding:8px}.bottom .active{color:var(--a);font-weight:800}.zoom{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:20px;z-index:50}.zoomPanel{position:relative;max-width:92vw}.zoom img{max-width:100%;max-height:82vh;border-radius:16px}.zoomClose{position:absolute;right:-8px;top:-14px;width:38px;height:38px;border:0;border-radius:50%;font-size:25px}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="app"><h1>All AR</h1><div class="sub">Japanische AR + geprüfte AR-Promos</div><div class="stats"><div class="stat"><b id="allN">0</b>Alle</div><div class="stat"><b id="ownedN">0</b>Habe ich</div><div class="stat"><b id="missN">0</b>Fehlen</div></div><input id="q" class="search" placeholder="Name, Set oder Nummer suchen…"><div class="tabs"><button class="chip active" data-filter="all">Alle</button><button class="chip" data-filter="missing">Fehlen</button><button class="chip" data-filter="owned">Habe ich</button><button class="chip" data-filter="promo">AR-Promos</button></div><button id="order" class="chip">Älteste zuerst</button><section id="gallery" class="gallery"><div id="cards" class="cards"></div></section><section id="binder" class="binder"></section></main><nav class="bottom"><button id="navCollection" class="active">Sammlung</button><button id="navBinder">Binder</button></nav><script>
let cards=[],filter='all',chronological='oldest';const KEY='all-ar-owned-v1',CAPACITY=1280,PROMO_START=1116;let states=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(states).forEach(id=>{if(states[id]!=='owned')states[id]='missing'});localStorage.setItem(KEY,JSON.stringify(states));const $=id=>document.getElementById(id),st=id=>states[id]||'missing',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function setState(id,s){states[id]=s;localStorage.setItem(KEY,JSON.stringify(states));render()}function visible(){let v=cards.filter(c=>{let s=st(c.id),x=$('q').value.toLowerCase();return !(filter==='owned'&&s!=='owned'||filter==='missing'&&s!=='missing'||filter==='promo'&&c.kind!=='AR Promo')&&(!x||`${c.name} ${c.name_ja} ${c.set_name} ${c.set_code} ${c.number_display}`.toLowerCase().includes(x))});return chronological==='newest'?v.reverse():v}function card(c){let s=st(c.id);return `<article class="card ${s}">${c.kind==='AR Promo'?'<span class="promo">PROMO</span>':''}<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.set_name)} · ${esc(c.number_display)}</div><div class="actions"><button class="${s==='owned'?'sel':''}" onclick="setState('${esc(c.id)}','owned')">Habe ich</button><button class="${s==='missing'?'sel':''}" onclick="setState('${esc(c.id)}','missing')">Fehlt</button></div></article>`}function render(){cardsEl.innerHTML=visible().map(card).join('');let o=cards.filter(c=>st(c.id)==='owned').length;$('allN').textContent=cards.length;$('ownedN').textContent=o;$('missN').textContent=cards.length-o;if(binder.classList.contains('show'))renderBinder()}function renderBinder(){let n=cards.filter(c=>c.kind==='AR'),p=cards.filter(c=>c.kind==='AR Promo'),a=Array(CAPACITY).fill(null);n.slice(0,PROMO_START).forEach((c,i)=>a[i]=c);p.slice(0,CAPACITY-PROMO_START).forEach((c,i)=>a[PROMO_START+i]=c);let page=(start,count=20)=>`<div class="page ${start>=PROMO_START?'promo-page':''}">${Array.from({length:count},(_,i)=>{let c=a[start+i],slot=start+i+1;return c?`<div class="slot ${st(c.id)}" data-id="${esc(c.id)}"><span class="n">${slot}</span><img src="${esc(c.image)}" alt="${esc(c.name)}"></div>`:'<div class="empty"></div>'}).join('')}</div>`;let h=`<h2>Dein 1.280er-Binder</h2><p class="hint">Normale ARs: Plätze 1–1116 (${PROMO_START-n.length} frei) · AR-Promos: Plätze 1117–1280 (${CAPACITY-PROMO_START-p.length} frei)</p><div class="spread"><h3>Startseite · nur rechts · Plätze 1–20</h3><div class="pages"><div></div>${page(0)}</div></div>`;for(let i=20,x=1;i<CAPACITY;i+=40,x++)h+=`<div class="spread"><h3>${i>=PROMO_START?'AR-Promo-Bereich':'Normale ARs'} · Doppelseite ${x} · Plätze ${i+1}–${Math.min(i+40,CAPACITY)}</h3><div class="pages">${page(i)}${page(i+20)}</div></div>`;binder.innerHTML=h}function show(x){gallery.classList.toggle('hide',x!=='c');binder.classList.toggle('show',x==='b');$('navCollection').classList.toggle('active',x==='c');$('navBinder').classList.toggle('active',x==='b');if(x==='b')renderBinder()}function zoom(id){let c=cards.find(x=>x.id===id);if(!c)return;let m=document.createElement('div');m.className='zoom';m.innerHTML=`<div class="zoomPanel"><button class="zoomClose">×</button><img src="${esc(c.image)}" alt="${esc(c.name)}"><div class="meta">${esc(c.name)} · ${esc(c.number_display)}</div></div>`;m.onclick=e=>{if(e.target===m||e.target.classList.contains('zoomClose'))m.remove()};document.body.append(m)}const cardsEl=$('cards'),binder=$('binder'),gallery=$('gallery');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});$('q').oninput=render;$('navCollection').onclick=()=>show('c');$('navBinder').onclick=()=>show('b');$('order').onclick=()=>{chronological=chronological==='oldest'?'newest':'oldest';$('order').textContent=chronological==='oldest'?'Älteste zuerst':'Neueste zuerst';render()};binder.onclick=e=>{let s=e.target.closest('.slot');if(s)zoom(s.dataset.id)};fetch('data/cards.json?v=20260923-promos').then(r=>r.json()).then(d=>{cards=d.cards||[];render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
