<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><title>All AR</title><style>
:root{--bg:#0b1020;--panel:#141b2d;--txt:#f7f8fb;--muted:#9ba7bf;--accent:#6ee7ff;--owned:#51d88a;--promo:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:900px;margin:auto;padding:14px 14px 90px}h1{margin:6px 0 2px;font-size:25px}h2{font-size:18px;margin:20px 2px 8px}.sub,.meta,.hint{color:var(--muted)}.sub,.hint{font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat,.card,.spread{background:var(--panel);border-radius:16px}.stat{padding:12px;text-align:center}.stat b{display:block;font-size:22px}.search{width:100%;padding:14px 16px;border:0;border-radius:16px;background:var(--panel);color:var(--txt);font-size:16px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.chip{border:0;border-radius:999px;background:var(--panel);color:var(--txt);padding:9px 12px;white-space:nowrap}.chip.active{background:var(--accent);color:#00131a;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:9px;position:relative}.card img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:11px;background:#202a45}.card.missing img,.slot.missing img{filter:grayscale(1);opacity:.3}.name{font-weight:750;font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px}.promo{position:absolute;right:14px;top:14px;background:var(--promo);color:#181000;font-size:9px;font-weight:800;border-radius:999px;padding:4px 7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.actions button{border:0;border-radius:9px;padding:8px 3px;font-size:11px;background:#263150;color:white}.actions button.sel{background:var(--owned);color:#07150c}.gallery.hide,.binder{display:none}.binder.show{display:block}.spread{padding:10px;margin:12px 0}.spread h3{margin:0 0 8px;font-size:14px}.pages{display:grid;grid-template-columns:1fr 1fr;gap:8px}.page{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0e1528;padding:5px;border-radius:10px}.slot{position:relative;cursor:zoom-in}.slot img,.empty{width:100%;aspect-ratio:63/88;border-radius:4px}.slot img{object-fit:cover}.slot .n{position:absolute;left:2px;top:2px;background:#000b;color:white;font-size:7px;padding:1px 3px;border-radius:5px}.empty{border:1px dashed #38435c}.promo-page{border:2px solid #765d1d}.bottom{position:fixed;left:0;right:0;bottom:0;background:#10172aee;backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:8px}.bottom button.active{color:var(--accent);font-weight:800}.notice{background:#2a2130;border:1px solid #584163;color:#f6d7ff;padding:10px;border-radius:12px;font-size:12px;margin:10px 0}.zoom{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:20px;z-index:50}.zoomPanel{position:relative;max-width:min(92vw,480px);max-height:92vh}.zoomPanel img{display:block;max-width:100%;max-height:82vh;border-radius:16px;box-shadow:0 12px 50px #000}.zoomClose{position:absolute;right:-8px;top:-14px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#111;font-size:25px}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="app"><h1>All AR</h1><div class="sub">Japanische AR + geprüfte AR-Promos</div><div id="notice" class="notice" hidden></div><div class="stats"><div class="stat"><b id="allN">0</b><span>Alle</span></div><div class="stat"><b id="ownedN">0</b><span>Habe ich</span></div><div class="stat"><b id="missN">0</b><span>Fehlen</span></div></div><input id="q" class="search" placeholder="Name, Set oder Nummer suchen…"><div class="tabs"><button class="chip active" data-filter="all">Alle</button><button class="chip" data-filter="missing">Fehlen</button><button class="chip" data-filter="owned">Habe ich</button><button class="chip" data-filter="promo">AR-Promos</button></div><button id="order" class="chip">Älteste zuerst</button><section id="gallery" class="gallery"><div id="cards" class="cards"></div></section><section id="binder" class="binder"></section></main><nav class="bottom"><button id="navCollection" class="active">Sammlung</button><button id="navBinder">Binder</button></nav><script>
let cards=[],filter='all',chronological='oldest';const KEY='all-ar-owned-v1',CAPACITY=1280,PROMO_START=1000;let states=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(states).forEach(id=>{if(states[id]!=='owned')states[id]='missing'});localStorage.setItem(KEY,JSON.stringify(states));const $=id=>document.getElementById(id),cardsEl=$('cards'),binder=$('binder'),gallery=$('gallery');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const st=id=>states[id]||'missing';function setState(id,state){states[id]=state;localStorage.setItem(KEY,JSON.stringify(states));render()}function updateStats(){let owned=0;cards.forEach(c=>{if(st(c.id)==='owned')owned++});$('allN').textContent=cards.length;$('ownedN').textContent=owned;$('missN').textContent=cards.length-owned}function visibleCards(){const query=$('q').value.trim().toLowerCase();const result=cards.filter(c=>{if(filter==='owned'&&st(c.id)!=='owned')return false;if(filter==='missing'&&st(c.id)!=='missing')return false;if(filter==='promo'&&c.kind!=='AR Promo')return false;return !query||`${c.name} ${c.name_ja} ${c.set_name} ${c.set_code} ${c.number_display}`.toLowerCase().includes(query)});return chronological==='newest'?[...result].reverse():result}function cardHtml(c){const state=st(c.id);return `<article class="card ${state}">${c.kind==='AR Promo'?'<span class="promo">PROMO</span>':''}<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.set_name)} · ${esc(c.number_display)}</div><div class="actions"><button class="${state==='owned'?'sel':''}" onclick="setState('${esc(c.id)}','owned')">Habe ich</button><button class="${state==='missing'?'sel':''}" onclick="setState('${esc(c.id)}','missing')">Fehlt</button></div></article>`}function render(){cardsEl.innerHTML=visibleCards().map(cardHtml).join('');updateStats();if(binder.classList.contains('show'))renderBinder()}function renderBinder(){const normal=cards.filter(c=>c.kind==='AR'),promos=cards.filter(c=>c.kind==='AR Promo'),slots=Array(CAPACITY).fill(null);normal.slice(0,PROMO_START).forEach((c,i)=>slots[i]=c);promos.slice(0,CAPACITY-PROMO_START).forEach((c,i)=>slots[PROMO_START+i]=c);const page=(start,count=20)=>`<div class="page ${start>=PROMO_START?'promo-page':''}">${Array.from({length:count},(_,i)=>{const c=slots[start+i],n=start+i+1;if(!c)return `<div class="empty" title="Freier Platz ${n}"></div>`;return `<div class="slot ${st(c.id)}" data-card-id="${esc(c.id)}" title="${esc(c.name)} · Platz ${n}"><span class="n">${n}</span><img src="${esc(c.image)}" alt="${esc(c.name)}"></div>`}).join('')}</div>`;let html=`<h2>Dein 1.280er-Binder</h2><p class="hint">Normale ARs: Plätze 1–1000 (${PROMO_START-normal.length} frei) · AR-Promos: Plätze 1001–1280 (${CAPACITY-PROMO_START-promos.length} frei)</p>`;html+=`<div class="spread"><h3>Startseite · nur rechts · Plätze 1–20</h3><div class="pages"><div></div>${page(0)}</div></div>`;for(let start=20,n=1;start<CAPACITY;start+=40,n++){const end=Math.min(start+40,CAPACITY),title=start>=PROMO_START?'AR-Promo-Bereich':'Normale ARs';html+=`<div class="spread"><h3>${title} · Doppelseite ${n} · Plätze ${start+1}–${end}</h3><div class="pages">${page(start)}${page(start+20)}</div></div>`}binder.innerHTML=html}function show(tab){gallery.classList.toggle('hide',tab!=='collection');binder.classList.toggle('show',tab==='binder');$('navCollection').classList.toggle('active',tab==='collection');$('navBinder').classList.toggle('active',tab==='binder');if(tab==='binder')renderBinder()}function zoomCard(id){const c=cards.find(card=>card.id===id);if(!c)return;const modal=document.createElement('div');modal.className='zoom';modal.innerHTML=`<div class="zoomPanel"><button class="zoomClose" aria-label="Schließen">×</button><img src="${esc(c.image)}" alt="${esc(c.name)}"><div class="meta">${esc(c.name)} · ${esc(c.set_name)} · ${esc(c.number_display)}</div></div>`;modal.onclick=e=>{if(e.target===modal||e.target.classList.contains('zoomClose'))modal.remove()};document.body.append(modal)}document.querySelectorAll('.chip[data-filter]').forEach(button=>button.onclick=()=>{document.querySelectorAll('.chip[data-filter]').forEach(b=>b.classList.remove('active'));button.classList.add('active');filter=button.dataset.filter;render()});$('q').oninput=render;$('navCollection').onclick=()=>show('collection');$('navBinder').onclick=()=>show('binder');binder.onclick=e=>{const slot=e.target.closest('.slot');if(slot?.dataset.cardId)zoomCard(slot.dataset.cardId)};$('order').onclick=()=>{chronological=chronological==='oldest'?'newest':'oldest';$('order').textContent=chronological==='oldest'?'Älteste zuerst':'Neueste zuerst';render()};fetch('data/cards.json?v=20260923-promos').then(r=>r.json()).then(d=>{cards=d.cards||[];render()}).catch(()=>{$('notice').hidden=false;$('notice').textContent='Kartendaten konnten nicht geladen werden.'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
