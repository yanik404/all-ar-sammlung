<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><title>All AR</title><style>
:root{--bg:#0b1020;--panel:#141b2d;--panel2:#1b2440;--txt:#f7f8fb;--muted:#9ba7bf;--accent:#6ee7ff;--ok:#51d88a;--warn:#ffd166;--bad:#768199}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:900px;margin:auto;padding:14px 14px 90px}h1{margin:6px 0 2px;font-size:25px}.sub{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:var(--panel);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}.search{width:100%;padding:14px 16px;border:0;border-radius:16px;background:var(--panel);color:var(--txt);font-size:16px;outline:none}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.chip{border:0;border-radius:999px;background:var(--panel);color:var(--txt);padding:9px 12px;white-space:nowrap}.chip.active{background:var(--accent);color:#00131a;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--panel);border-radius:16px;padding:9px;position:relative}.card img{width:100%;border-radius:11px;aspect-ratio:63/88;object-fit:cover;background:#202a45;transition:.2s}.card.missing img{filter:grayscale(1);opacity:.30}.card.unsure img{filter:saturate(.7);opacity:.72}.card.owned img{filter:none;opacity:1}.name{font-weight:750;font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted)}.promo{position:absolute;right:14px;top:14px;background:var(--warn);color:#181000;font-size:9px;font-weight:800;border-radius:999px;padding:4px 7px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:7px}.actions button{border:0;border-radius:9px;padding:7px 3px;font-size:10px;background:#263150;color:white}.actions button.sel.ok{background:var(--ok);color:#07150c}.actions button.sel.warn{background:var(--warn);color:#171000}.binder{display:none}.binder.show{display:block}.gallery.hide{display:none}.spread{background:var(--panel);border-radius:18px;padding:10px;margin:12px 0}.spread h3{margin:0 0 8px;font-size:14px}.pages{display:grid;grid-template-columns:1fr 1fr;gap:8px}.page{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0e1528;padding:5px;border-radius:10px}.slot{position:relative}.slot img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:4px}.slot.missing img{filter:grayscale(1);opacity:.25}.slot.unsure img{filter:saturate(.7);opacity:.65}.slot .n{position:absolute;left:2px;top:2px;background:#000b;color:white;font-size:7px;padding:1px 3px;border-radius:5px}.empty{aspect-ratio:63/88;border:1px dashed #38435c;border-radius:4px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#10172aee;backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:8px}.bottom button.active{color:var(--accent);font-weight:800}.notice{background:#2a2130;border:1px solid #584163;color:#f6d7ff;padding:10px;border-radius:12px;font-size:12px;margin:10px 0}.backup{display:none;background:var(--panel);border-radius:16px;padding:14px}.backup.show{display:block}.backup button{width:100%;margin:5px 0;padding:12px;border:0;border-radius:12px;background:var(--panel2);color:white}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><h1>All AR</h1><div class="sub">Japanische AR + geprüfte AR-Promos</div><div id="notice" class="notice" hidden></div><div class="stats"><div class="stat"><b id="allN">0</b><span>Alle</span></div><div class="stat"><b id="ownedN">0</b><span>Habe ich</span></div><div class="stat"><b id="missN">0</b><span>Fehlen</span></div></div><input id="q" class="search" placeholder="Name, Set oder Nummer suchen…"><div class="tabs"><button class="chip active" data-filter="all">Alle</button><button class="chip" data-filter="missing">Fehlen</button><button class="chip" data-filter="owned">Habe ich</button><button class="chip" data-filter="unsure">Unsicher</button><button class="chip" data-filter="promo">AR-Promos</button></div><section id="gallery" class="gallery"><div id="cards" class="cards"></div></section><section id="binder" class="binder"></section><section id="backup" class="backup"><h3>Backup</h3><button onclick="exportBackup()">Besitz-Backup herunterladen</button><button onclick="document.getElementById('importFile').click()">Backup importieren</button><input id="importFile" type="file" accept="application/json" hidden></section></div><nav class="bottom"><button id="navCollection" class="active">Sammlung</button><button id="navBinder">Ordner</button><button id="navBackup">Backup</button></nav><script>
let cards=[],filter='all';const KEY='all-ar-owned-v1';let states=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(states));updateStats()}
function st(id){return states[id]||'missing'}
function setState(id,s){states[id]=s;save();render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function updateStats(){allN.textContent=cards.length;let o=0,m=0;cards.forEach(c=>st(c.id)==='owned'?o++:m++);ownedN.textContent=o;missN.textContent=m}
function filtered(){const qv=q.value.trim().toLowerCase();return cards.filter(c=>{const s=st(c.id);if(filter==='missing'&&s!=='missing')return false;if(filter==='owned'&&s!=='owned')return false;if(filter==='unsure'&&s!=='unsure')return false;if(filter==='promo'&&c.kind!=='AR Promo')return false;if(qv&&!`${c.name} ${c.name_ja} ${c.set_name} ${c.set_code} ${c.number_display}`.toLowerCase().includes(qv))return false;return true})}
function cardHtml(c){const s=st(c.id);return `<article class="card ${s}">${c.kind==='AR Promo'?'<span class="promo">PROMO</span>':''}<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.set_name)} · ${esc(c.number_display)}</div><div class="actions"><button class="${s==='owned'?'sel ok':''}" onclick="setState('${esc(c.id)}','owned')">Habe ich</button><button class="${s==='missing'?'sel':''}" onclick="setState('${esc(c.id)}','missing')">Fehlt</button><button class="${s==='unsure'?'sel warn':''}" onclick="setState('${esc(c.id)}','unsure')">Unsicher</button></div></article>`}
function render(){cardsEl.innerHTML=filtered().map(cardHtml).join('');updateStats();if(binder.classList.contains('show'))renderBinder()}
function renderBinder(){const arr=cards;let h='';const page=(start,count=20)=>`<div class="page">${Array.from({length:count},(_,i)=>{const c=arr[start+i];if(!c)return '<div class="empty"></div>';const s=st(c.id);return `<div class="slot ${s}" title="${esc(c.name)}"><span class="n">${start+i+1}</span><img src="${esc(c.image)}"></div>`}).join('')}</div>`;h+=`<div class="spread"><h3>Startseite · nur rechts · Slots 1–20</h3><div class="pages"><div></div>${page(0)}</div></div>`;for(let start=20,n=1;start<arr.length;start+=40,n++)h+=`<div class="spread"><h3>Doppelseite ${n} · Slots ${start+1}–${Math.min(start+40,arr.length)}</h3><div class="pages">${page(start)}${page(start+20)}</div></div>`;binder.innerHTML=h}
function show(tab){gallery.classList.toggle('hide',tab!=='collection');binder.classList.toggle('show',tab==='binder');backup.classList.toggle('show',tab==='backup');navCollection.classList.toggle('active',tab==='collection');navBinder.classList.toggle('active',tab==='binder');navBackup.classList.toggle('active',tab==='backup');if(tab==='binder')renderBinder()}
function exportBackup(){const b=new Blob([JSON.stringify(states,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='all-ar-backup.json';a.click();URL.revokeObjectURL(a.href)}
importFile.onchange=async e=>{try{states=JSON.parse(await e.target.files[0].text());save();render();alert('Backup importiert')}catch{alert('Ungültiges Backup')}};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});q.oninput=render;navCollection.onclick=()=>show('collection');navBinder.onclick=()=>show('binder');navBackup.onclick=()=>show('backup');
const cardsEl=document.getElementById('cards');fetch('data/cards.json').then(r=>r.json()).then(d=>{cards=d.cards||[];if(!cards.length){notice.hidden=false;notice.textContent='Kartendaten sind noch nicht gebaut. Starte den GitHub-Workflow „Update verified AR data“.'}render()}).catch(e=>{notice.hidden=false;notice.textContent='Kartendaten konnten nicht geladen werden.'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
