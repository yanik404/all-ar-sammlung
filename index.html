<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11152b"><link rel="manifest" href="manifest.webmanifest"><title>All AR</title><style>
:root{--ink:#f9faff;--muted:#adb7d2;--base:#0a0e21;--card:#161c36;--line:#2a3560;--cyan:#82e9ff;--mint:#77e4a5;--gold:#ffd876;--rose:#ff9cad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -5%,#273769 0,transparent 31%),radial-gradient(circle at 100% 15%,#214154 0,transparent 27%),var(--base);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:980px;margin:auto;padding:18px 14px 104px}.hero{padding:20px;border:1px solid #334271;border-radius:26px;background:linear-gradient(130deg,#202b59dd,#111731ee);box-shadow:0 14px 40px #0005}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:800}.hero h1{font-size:32px;letter-spacing:-.06em;margin:4px 0}.sub{font-size:14px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{padding:13px 7px;border:1px solid #303b65;background:#141a32c9;border-radius:18px;text-align:center}.stat b{display:block;color:var(--cyan);font-size:21px}.stat span{font-size:11px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:10;padding:14px 0 8px;background:linear-gradient(var(--base) 65%,transparent)}.search{width:100%;padding:14px 15px;border:1px solid #34416a;border-radius:15px;background:#151b35;color:var(--ink);font-size:16px;outline:none}.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #82e9ff20}.tabs{display:flex;gap:7px;overflow:auto;padding:11px 0 3px}.chip{border:1px solid #303c66;border-radius:999px;background:#171d37;color:#dce4fb;padding:9px 12px;white-space:nowrap;font-size:12px}.chip.active{border-color:var(--cyan);background:var(--cyan);color:#07121f;font-weight:800}.sort{margin-top:8px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:14px}.card{position:relative;padding:8px;border-radius:18px;background:linear-gradient(145deg,#20294d,#11162c);border:1px solid #303a62;box-shadow:0 8px 20px #0003;overflow:hidden}.card:has(.sel){border-color:#53d991}.card img{display:block;width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:12px;background:#252e50}.missing img,.slot.missing img{filter:grayscale(.85);opacity:.35}.name{font-weight:800;font-size:13px;margin:8px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin:0 2px}.promo{position:absolute;right:13px;top:13px;padding:4px 7px;border-radius:999px;background:var(--gold);color:#241c00;font-size:9px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.actions button{border:1px solid #36426b;background:#222b4b;color:white;padding:8px 2px;border-radius:10px;font-size:11px}.actions .sel{background:var(--mint);border-color:var(--mint);color:#082014;font-weight:800}.binder,.gallery.hide{display:none}.binder.show{display:block}.binder-title{margin:22px 0 5px;font-size:23px}.hint{margin:0 0 16px;color:var(--muted);font-size:12px}.spread{padding:10px;margin:12px 0;border-radius:19px;border:1px solid #303b65;background:#141a31}.spread h3{margin:0 0 8px;font-size:12px;color:var(--muted)}.pages{display:grid;grid-template-columns:1fr 1fr;gap:8px}.page{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;background:#090d1c;border-radius:11px}.promo-page{outline:2px solid #745f25}.slot{position:relative;cursor:zoom-in}.slot img,.empty{width:100%;aspect-ratio:63/88;border-radius:4px}.slot img{object-fit:cover}.slot .n{position:absolute;top:2px;left:2px;padding:1px 3px;border-radius:4px;background:#000b;font-size:7px}.empty{border:1px dashed #33405f}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;gap:8px;justify-content:center;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));background:#0b1023eF;backdrop-filter:blur(16px);border-top:1px solid #293454}.bottom button{flex:1;max-width:190px;border:1px solid transparent;border-radius:14px;padding:10px;background:transparent;color:var(--muted);font-weight:700}.bottom .active{color:var(--cyan);background:#1d294b;border-color:#344873}.zoom{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:#050714eF;backdrop-filter:blur(9px)}.zoomPanel{position:relative;max-width:min(92vw,490px)}.zoom img{max-width:100%;max-height:82vh;border-radius:18px;box-shadow:0 20px 70px #000}.zoomClose{position:absolute;right:-10px;top:-13px;width:40px;height:40px;border:0;border-radius:50%;background:white;color:#15192d;font-size:27px}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="app"><header class="hero"><div class="eyebrow">Personal Collection</div><h1>All AR</h1><div class="sub">Japanese Art Rares · alles an einem Ort</div></header><div class="stats"><div class="stat"><b id="allN">0</b><span>Gesamt</span></div><div class="stat"><b id="ownedN">0</b><span>Habe ich</span></div><div class="stat"><b id="missN">0</b><span>Fehlt</span></div></div><div class="toolbar"><input id="q" class="search" placeholder="Karte, Set oder Nummer suchen…"><div class="tabs"><button class="chip active" data-filter="all">Alle Karten</button><button class="chip" data-filter="missing">Fehlen</button><button class="chip" data-filter="owned">Habe ich</button><button class="chip" data-filter="promo">AR-Promos</button></div><button id="order" class="chip sort">Älteste zuerst</button></div><section id="gallery"><div id="cards" class="cards"></div></section><section id="binder" class="binder"></section></main><nav class="bottom"><button id="navCollection" class="active">☷ Sammlung</button><button id="navBinder">▣ Mein Binder</button></nav><script>
let cards=[],filter='all',newest=false;const KEY='all-ar-owned-v1',CAP=1280,PS=1116;let states=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(states).forEach(i=>{if(states[i]!=='owned')states[i]='missing'});localStorage.setItem(KEY,JSON.stringify(states));const $=i=>document.getElementById(i),st=i=>states[i]||'missing',esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function setState(i,s){states[i]=s;localStorage.setItem(KEY,JSON.stringify(states));render()}function shown(){let q=$('q').value.toLowerCase(),r=cards.filter(c=>!(filter==='owned'&&st(c.id)!=='owned'||filter==='missing'&&st(c.id)!=='missing'||filter==='promo'&&c.kind!=='AR Promo')&&(!q||`${c.name} ${c.name_ja} ${c.set_name} ${c.set_code} ${c.number_display}`.toLowerCase().includes(q)));return newest?r.reverse():r}function tile(c){let s=st(c.id);return `<article class="card ${s}">${c.kind==='AR Promo'?'<i class="promo">PROMO</i>':''}<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.set_name)} · ${esc(c.number_display)}</div><div class="actions"><button class="${s==='owned'?'sel':''}" onclick="setState('${esc(c.id)}','owned')">Habe ich</button><button class="${s==='missing'?'sel':''}" onclick="setState('${esc(c.id)}','missing')">Fehlt</button></div></article>`}function render(){let r=shown();$('cards').innerHTML=r.map(tile).join('');let o=cards.filter(c=>st(c.id)==='owned').length;$('allN').textContent=cards.length;$('ownedN').textContent=o;$('missN').textContent=cards.length-o;if($('binder').classList.contains('show'))binder()}function binder(){let n=cards.filter(c=>c.kind==='AR'),p=cards.filter(c=>c.kind==='AR Promo'),a=Array(CAP).fill(null);n.forEach((c,i)=>{if(i<PS)a[i]=c});p.forEach((c,i)=>{if(i<CAP-PS)a[PS+i]=c});let page=(i,z=20)=>`<div class="page ${i>=PS?'promo-page':''}">${Array.from({length:z},(_,j)=>{let c=a[i+j],x=i+j+1;return c?`<div class="slot ${st(c.id)}" data-id="${esc(c.id)}"><span class="n">${x}</span><img src="${esc(c.image)}"></div>`:'<div class="empty"></div>'}).join('')}</div>`;let h=`<h2 class="binder-title">Mein 1.280er-Binder</h2><p class="hint">Normale ARs: Plätze 1–1116 · ${PS-n.length} frei &nbsp;•&nbsp; AR-Promos: Plätze 1117–1280 · ${CAP-PS-p.length} frei</p><div class="spread"><h3>Startseite · Plätze 1–20</h3><div class="pages"><div></div>${page(0)}</div></div>`;for(let i=20,k=1;i<CAP;i+=40,k++)h+=`<div class="spread"><h3>${i>=PS?'AR-Promo-Bereich':'Normale ARs'} · Doppelseite ${k} · Plätze ${i+1}–${Math.min(i+40,CAP)}</h3><div class="pages">${page(i)}${page(i+20)}</div></div>`;$('binder').innerHTML=h}function show(v){$('gallery').classList.toggle('hide',v!=='c');$('binder').classList.toggle('show',v==='b');$('navCollection').classList.toggle('active',v==='c');$('navBinder').classList.toggle('active',v==='b');if(v==='b')binder()}function zoom(id){let c=cards.find(x=>x.id===id),m=document.createElement('div');if(!c)return;m.className='zoom';m.innerHTML=`<div class="zoomPanel"><button class="zoomClose">×</button><img src="${esc(c.image)}"><div class="meta">${esc(c.name)} · ${esc(c.number_display)}</div></div>`;m.onclick=e=>{if(e.target===m||e.target.classList.contains('zoomClose'))m.remove()};document.body.append(m)}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});$('q').oninput=render;$('order').onclick=()=>{newest=!newest;$('order').textContent=newest?'Neueste zuerst':'Älteste zuerst';render()};$('navCollection').onclick=()=>show('c');$('navBinder').onclick=()=>show('b');$('binder').onclick=e=>{let s=e.target.closest('.slot');if(s)zoom(s.dataset.id)};fetch('data/cards.json?v=20260923-promos').then(r=>r.json()).then(d=>{cards=d.cards||[];render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
