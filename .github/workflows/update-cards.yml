name: Update verified AR data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/build_cards.py
      - name: Commit changed data
        run: |
          git config user.name "all-ar-bot"
          git config user.email "all-ar-bot@users.noreply.github.com"
          git add data/cards.json
          git diff --cached --quiet || git commit -m "Update verified Japanese AR data"
          git push
